# This workflow is triggered on pushes to any branch except 'production' and on pull requests targeting the 'production' branch.
# It performs a syntax check by compiling the debug sources of the Android project using Gradle. 
# This helps ensure that the code is syntactically correct before it is merged into the production branch.

name: QA

on:
  push:
    branches:
      - '**'
      - '!production'
  pull_request:
    branches:
      - 'production'

permissions:
  contents: read

jobs:
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Debug Sources
        run: ./gradlew compileDebugSources

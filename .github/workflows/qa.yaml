name: QA

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Debug Sources
        run: ./gradlew compileDebugSources
